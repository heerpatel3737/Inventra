name: common_inventory_management_software
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.1
  flutter_riverpod: ^2.6.1
  fl_chart: ^1.2.0

  # Storage & Database
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.3.4

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.0
  firebase_storage: ^13.4.2

  # Authentication
  google_sign_in: ^6.2.1

  # Environment Variables
  flutter_dotenv: ^6.0.1

  # Networking
  http: ^1.6.0
  dio: ^5.9.0
  connectivity_plus: ^7.1.1

  # Images
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1

  # Barcode / QR scanning
  mobile_scanner: ^7.0.1

  # Utilities
  uuid: ^4.5.1
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env